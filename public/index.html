<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL Shortener</title>
    <style>
      :root { color: #17212b; background: #eef4f1; font-family: Georgia, serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(34rem, calc(100% - 2rem)); padding: 3rem 0; }
      h1 { margin: 0 0 .5rem; font-size: clamp(2.4rem, 9vw, 4.5rem); line-height: .95; }
      p { color: #53645f; font-size: 1.1rem; }
      form { display: flex; gap: .6rem; margin-top: 2rem; }
      input, button { border: 2px solid #17212b; border-radius: 0; padding: .85rem 1rem; font: inherit; }
      input { min-width: 0; flex: 1; background: #fff; }
      button { cursor: pointer; background: #f5b544; }
      #result { min-height: 1.5rem; margin-top: 1.25rem; }
      @media (max-width: 30rem) { form { flex-direction: column; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Shorten a link.</h1>
      <p>Enter a reachable HTTP or HTTPS URL to create a compact redirect.</p>
      <form action="/api/shorturl" method="post">
        <input name="url" type="url" placeholder="https://example.com" required>
        <button type="submit">Shorten</button>
      </form>
      <p id="result" aria-live="polite"></p>
    </main>
    <script>
      const form = document.querySelector('form');
      const result = document.querySelector('#result');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const response = await fetch(form.action, { method: 'POST', body: new URLSearchParams(new FormData(form)) });
        const data = await response.json();
        result.textContent = data.error || `${location.origin}/api/shorturl/${data.short_url}`;
      });
    </script>
  </body>
</html>
